<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torotech Status - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #1a2b4a;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            color: #6b7280;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }
        input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30,64,175,0.15);
        }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }
        button:hover { background: #1e3a8a; }
        .erro {
            background: #fef2f2;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Torotech Status</h1>
        <p class="subtitle">Controle de Status de Ordens de Serviço</p>

        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" required autocomplete="username">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
